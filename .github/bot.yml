name: Lyrivo Telegram Bot

on:
  push:
    branches:
      - main
  schedule:
    # በየ 5 ሰዓቱ አውቶማቲክ በራሱ ቦቱን እንደገና ያስነሳዋል
    - cron: '0 */5 * * *'
  workflow_dispatch: # በእጅህ መጥተህ Run እንዲያደርግ ከፈለግክም ያስችላል

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/latest # ወይም actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiogram

      - name: Run Bot
        run: python main.py
